    <script>
      // Old address -> new home. Off until storywala.divyanshujangid.in DNS is live; flip to true then.
      // Add ?stay=1 to keep testing on the old host.
      (function () {
        var REDIRECT_OLD_HOST = false;
        if (!REDIRECT_OLD_HOST) return;
        if (location.hostname !== 'chamak.pages.dev') return;
        if (/(?:^|[?&])stay=1(?:&|$)/.test(location.search)) return;
        location.replace('https://storywala.divyanshujangid.in' + location.pathname + location.search + location.hash);
      })();
    </script>
